[package]
name = "poe-ledger"
version = "0.1.0"
description = "A modular desktop overlay for Path of Exile 1"
authors = ["Poe Ledger Team"]
edition = "2021"

[lib]
name = "poe_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
